# 全站安全响应头。
#
# 为什么是一个 include 而不是写在 server 块里一次：nginx 的 `add_header` **不叠加**。
# 只要某个 location 自己声明了任何一条 add_header（这里几乎每个 location 都要设
# Cache-Control），它就会把 server 级的整组头全部丢掉。所以凡是自带 add_header 的
# location 都必须再 include 一次，漏一个那条路径就是裸奔。
#
# HSTS 不在这里：TLS 在外层（宿主 nginx / 云 LB）终止，那一层已经加了
# （见 scripts/lib/docker-deploy-remote.sh 与 scripts/acme-helper.py）。
# 在只监听 80 的容器里再发一次 HSTS 没有意义。
#
# CSP 不在这里，因为它按响应类型而不同，且**一份响应只该有一个策略**：
#   · nginx 直出的应用壳层 HTML → docker/nginx/csp-app.conf（构建时按内联脚本 hash 生成）
#   · 反代给应用的 SSR / API    → 由应用自己发（租户统计脚本的来源要按站点算）
# 两边同时发会让浏览器取两份策略的交集，调起来极难。

# 浏览器不得对 Content-Type 做嗅探——上传的文件被猜成 HTML 就是一次储存型 XSS。
add_header X-Content-Type-Options "nosniff" always;

# 禁止被别的站点套进 iframe（点击劫持）。Theme Editor 的预览用的是 srcDoc，
# 不走网络请求，不受这条影响。
add_header X-Frame-Options "SAMEORIGIN" always;

# 跨站跳转时只发送来源站点，不带路径与查询串（后者常含 token / 邮箱）。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
