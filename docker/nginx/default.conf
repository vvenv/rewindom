upstream app_backend {
    server app:3700;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/html application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location ~ ^/api/(documents|search) {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        gzip off;
    }

    location /api/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 官网的静态产物：`/pricing` → `/pricing/index.html`（预渲染出的目录索引）。
    # 兜底文件是 app.html 而不是 index.html——后者已经是预渲染的落地页，
    # 拿它兜底会让刷新 /notes 先闪一屏官网内容再切回应用。
    location / {
        try_files $uri $uri/index.html /app.html;
        add_header Cache-Control "no-cache" always;
    }

    # sitemap / robots 变动不频繁，但也不该缓存到改了没生效
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
