# 把订阅入口真正交到租户手里：编辑器视图（**修 bug**）+ 页脚常驻块 + 两张模板页。
#
# 第一条是缺陷不是增强：模块交付时只调了 `registerSiteSectionHtml`（实站 SSR），
# **漏了 `registerSiteSectionView`（编辑器预览）**。后果是租户在 Theme Editor 的
# 段列表里根本找不到「邮件订阅」，段能渲染但没人放得上去——整个模块从头到尾用不了。
# site-form 的 MODULE.md 把这两处并列写着，我只做了其中一处。
#
# 另外两条是这次交付时按「先跑通」砍掉的，现在补回来：
#   - **chrome 块**：订阅入口和购物车入口、语言切换是同一类东西——站点级常驻，
#     不该只能作为正文里的一个段存在。events 的 RSS 订阅走了两版才想明白这件事
#     （见 public-rss.spec 的设计要点 6），这里直接抄结论，不再重走一遍。
#   - **模板页**：确认页与退订页现在是零品牌的裸 HTML。读者从邮件点进来，落在一个
#     跟这个站毫无关系的白页上——「我是不是被钓鱼了」。退订页尤其：那是读者对这个
#     站的最后一次印象。

