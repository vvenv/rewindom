goal: |
  1）补上编辑器段视图注册，让「邮件订阅」段在 Theme Editor 里可见可放置；
  2）新增页头/页脚 chrome 块 `newsletter.subscribe-link`（singleton）；
  3）把 /newsletter/confirm 与 /newsletter/unsubscribe 做成租户可排版的模板页，
     必备段由代码渲染，版式交给站长。
gold: modules/site-form/client/module.tsx # 编辑器注册；模板页看 site-member 三张会员页
touch:
  - modules/newsletter/features/site-editor-contributions.spec.yaml
  - modules/newsletter/MODULE.md
  - modules/newsletter/MODULE.spec.yaml # site_contributions 补块与模板页
  - modules/newsletter/client/module.tsx # registerSiteSectionView + registerChromeBlockView
  - modules/newsletter/shared/sections/subscribe-link/definition.ts
  - modules/newsletter/shared/sections/subscribe-link/html.ts
  - modules/newsletter/shared/sections/subscribe-link/html.test.ts
  - modules/newsletter/shared/sections/confirm/definition.ts
  - modules/newsletter/shared/sections/confirm/html.ts
  - modules/newsletter/shared/sections/unsubscribe/definition.ts
  - modules/newsletter/shared/sections/unsubscribe/html.ts
  - modules/newsletter/shared/newsletter-page-templates.ts
  - modules/newsletter/shared/site-css/newsletter.css
  - modules/newsletter/server/register.ts # 段 / 块 / 模板 kind + preset
  - modules/newsletter/server/newsletter.ssr.ts # 改走 renderMarketingHtml
  - modules/newsletter/server/newsletter.ssr.test.ts
  - modules/newsletter/client/locales/en.json
  - modules/newsletter/client/locales/zh-CN.json
out_of_scope:
  - 订阅段的列表下拉选择器（要接 options_from + per-request 贡献上下文，见 MODULE.spec）
  - 把 chrome 块做成「输入框直接内嵌页脚」（先做成链接/按钮，见设计要点 3）
