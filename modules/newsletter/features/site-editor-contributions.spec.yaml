entitlement: newsletter
permissions: []
models: []

# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
# 1. **编辑器预览灌同一个 HTML 渲染器，不另写 React。**
#    `registerSiteSectionView(def, htmlSectionView(render), { css, icon })`，
#    与 site-form 逐字同构。公开站是 SSR HTML，预览再写一套 JSX 只会让两边慢慢漂。
#    编辑器里 `HtmlFragment` 已经把 submit 拦掉了，预览中的表单点不出提交。
#    顺带补上 client manifest 漏掉的 `requires: ["marketing"]`。
#
# 2. **chrome 块必须 `singleton: true`。**
#    一个站只该有一个常驻订阅入口。与 `events.subscribe-link`、`shop.cart-link` 同形，
#    默认落**页脚**（`chromeSlotSettings({ align: "end", mobile: "menu" })`）——
#    订阅是常驻但次要的入口，不该和主导航抢位置。
#
# 3. **chrome 块是「链接/按钮」，不是内嵌输入框。**
#    页头页脚那一排寸土寸金，塞一个 email input 会把版式挤垮，而且它得带上
#    提交、校验、回执三套状态。块点开跳到摆了订阅段的页面（setting 里配目标路径，
#    默认取本站第一张含订阅段的页面）。想要「页脚直接填邮箱」是后续，先验证入口有没有人点。
#
# 4. **两张模板页各只有一个必备段，编辑器不给删。**
#    `newsletter.confirm-panel` / `newsletter.unsubscribe-panel`，
#    与 site-member 三张会员页同一套机制（`page-templates.ts`）。
#    kind 决定 slug（`newsletter-confirm` / `newsletter-unsubscribe`），租户改不了——
#    改了地址，那些已经发出去的邮件里的链接就全废了。
#    分组 key 新开一个 `NEWSLETTER_PAGE_TEMPLATE_GROUP`（这不是 `/member/*` 那一族）。
#
# 5. **`auto_init: false`。** 与会员版式同口径：不预建，租户点「初始化版式」或开通
#    订阅开关时由 marketing 落库。默认给所有存量站点凭空多两张页面是骚扰。
#
# 6. **站点没发布时仍要能打开。** 走 `getSiteChromeOrFallback`——退订不能因为站长
#    把官网下线了就失效。这是现在那版裸 HTML 唯一做对的事，改造后不能丢。
#    模板页快照缺失时同样回落到当前的极简版式，而不是 500。
#
# 7. **副作用仍然只在 POST，同源规则不变。**
#    确认页校验 Origin，退订页**不校验**（`List-Unsubscribe-Post` 的一键退订来自
#    邮件服务商的服务器，没有我们的 Origin）。改成模板页只换外壳，不碰这条。
#
# 8. **`/newsletter/*` 仍然不进 SITE_APP_PREFIXES。**
#    它像普通 CMS 路径一样落到 Fastify，静态路由比 `/:first/:second` 更具体会先命中。
#    nginx / vite 那三份表不需要动——site-member 需要，是因为 `member` 在应用区前缀里。
#    改造后这一点不变，别顺手加进去。
