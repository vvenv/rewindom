# 卡片的来源行喧宾夺主，而且有一半图标是空的。
#
# 线上实测（yestino.com 首页，1512px，15 张卡）：
#
# 1. **六家出版方的 favicon 是一张全空的图**。`/events/icons/{host}` 给
#    variety / hollywoodreporter / deadline / rollingstone / billboard /
#    consequence 返回的是同一个 198 字节的 ICO：16×16、1bpp，XOR 位图整片同一个
#    调色板索引、AND 掩码整片透明——屏幕上什么都画不出来。
#    它**加载成功**，于是 `:has(.events-source-icon)` 把 fallback 藏掉，
#    卡片上就是一排空灰方块——比没有图标更像坏了。
#    这几家的 HTML 里其实**有**真图（variety 的 favicon.png、deadline 的
#    icon-32x32.png、consequence 的 favicon-32x32.png），只是 `/favicon.ico`
#    先返回了 200，取图流程再也走不到 `<link rel=icon>` 那一步。
#
# 2. **公开卡片的来源行没有上限**。工作台那张 React 卡片截到 3 家 + `+N`，
#    SSR 这份全量渲染：一张 Dolly Parton 的卡列了 9 家、占三行，
#    视觉重量压过标题本身。同一个产品两套口径。
#
# 3. **标题与来源之间还有空洞**。`margin-top:auto`（card-affordance）解决的是
#    「内容全部顶对齐」，剩下的方差来自标题行数：同排卡高恒为 258px，
#    标题 2 行的卡 gap 84px、4 行的 gap 8px，15 张平均 39px。
#
# 4. **12px 的 globe fallback 不携带信息**。一团灰糊，和上面那张空图看不出区别；
#    而首字母是这家出版方**自己的**信息，同样零宽度成本。

