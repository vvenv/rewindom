# ---------- 设计要点 ----------
# 1. `events_topic`：kind 唯一、每种语言一张，path `/events/:topic`（根挂载时
#    `/:topic`）。预设 = 首屏 + 升温 + 正在发生 + 实体条 + 订阅。required_section
#    为 null（与枢纽同理由：不是「有且仅有一段」）。
# 2. path handler：有 pathTopic 走 `events_topic`，枢纽 / 首页走 `events_index` 或
#    home。查询列表仍覆盖 sections，kind 跟着有没有 topic 走。
# 3. 首屏不再有 topic_* 覆盖。专题页库存文案自己写 `{topic}`；订阅是普通
#    `linkSettings("secondary")`，默认 href `/events/{topic_slug}/feed.xml`。
#    空路径段渲染时收掉，站点首页变成 `/events/feed.xml`。
# 4. 插值语法与页脚 chrome_text 同一套：`{token}`，不是 i18next 的 `{{param}}`。
#    内置 `{year}` `{site}` `{hostname}` `{url}`；模块经 contributed.interpolation
#    贡献 `{topic}` `{topic_slug}`。未识别的 `{foo}` 原样留下。
# 5. 链接候选加一项「当前主题 RSS」= `/events/{topic_slug}/feed.xml`（稳定存进
#    setting，渲染期解析）。钉死某一格的 `/events/ai/feed.xml` 仍在。
# 6. 编辑器编专题模板时用已启用的第一格当样张，好让 `{topic}` 在预览里看得见。
