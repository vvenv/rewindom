# `/ai` `/tech` 与枢纽 / 首页共用一张 CMS 页，首屏才被迫长出 topic_* 覆盖字段，
# 订阅按钮也只能在渲染时暗改地址。两套文案抢同一颗按钮，根因是一张页演两种身份。
# 正确拆法与详情页同构：一张 `events_topic` 模板管所有 `/events/:topic`，
# 格子之间共用版式；身份文案写在这张页上，用与页脚同一套 `{token}` 插值填七格。

