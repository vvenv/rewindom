  - modules/events/features/entity-co-occurrence.spec.yaml
  - modules/events/MODULE.md
  - modules/events/server/event/entity-co-occurrence.service.ts # 新建，与 entity-profile.service.ts 对称
  - modules/events/server/event/entity-co-occurrence.service.test.ts
  - modules/events/server/ssr/public-events.service.ts # getPublicEntityBySlug 调用并装入 PublicEntityData
  - modules/events/server/ssr/public-events.service.test.ts
  - modules/events/shared/public-view.ts # PublicEntityRecord + toPublicEntity 映射
  - modules/events/shared/events-section-context.ts # PublicEntityView 加字段
  - modules/events/shared/sections/entity-html.ts # 加段渲染
  - modules/events/shared/sections/entity-html.test.ts
  - modules/events/shared/site-css/events.css
  - modules/events/client/locales/en.json
  - modules/events/client/locales/zh-CN.json
