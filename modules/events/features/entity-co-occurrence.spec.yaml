# 实体页加「相关实体」段——按共现事件数排序的实体推荐。
#
# 与事件页的 Related Events 对称，但数据源不同：相关事件靠 centroid 语义相似度
#（预计算，因为载入向量贵）；相关实体靠 EventEntityLink 自连接——同一件事里
# 还出现了谁。那是可核对的计数，不是"猜你喜欢"。
#
# 读路径上算，不预计算、不加列：groupBy 轻量，且实体页是低频页面（vs 详情页
# 每次刷新）。与 entity-profile 同一条理由——档案也是读路径上算的。
#
# 竞品的实体页是搜索结果，没有实体间的结构化关联。这一段把"这两家常一起
# 出现"变成可浏览的关系，是实体页该有却还没有的那一层。

# ---------- 必填 ----------
module: events
surfaces: [ssr]
goal: 公开实体页在事件列表后面展示「相关实体」——同一事件里共现过的其他实体，按共现事件数降序，最多 5 条。
gold: modules/events/shared/sections/entity-index-html.ts # 抄胶囊形状；entity-profile.service.ts 抄 groupBy + i18n code 口径
