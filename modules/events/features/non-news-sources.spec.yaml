out_of_scope:
  - 招聘源（Greenhouse / Lever 是 JSON API，要写第三个 connector，单独一期）
  - 新 connector（仍只有 hackernews 与 rss）
  - 中文源（跨语言阈值要单独校准，见 MODULE.md「后续」）
  - 段定义 / 模板页 / 导航源（本期不加段，公开面只加查询参数——要加段走 site-section）
  - 带条件的对外 RSS（`?kind=release` 之类，见「后续」）
  - 回填存量站点已有源的 source_kind（见设计要点 7）
