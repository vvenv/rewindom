# 目录里 36 个源全是「新闻」——这正是竞品最强的一条线（Google News 抓全网、
# Techmeme 有编辑团队）。在这条线上比覆盖面永远比不过。
#
# 差异化的落点是**非新闻源**：changelog / release notes / status page / 监管公告。
# 对 B 端读者「竞对昨天上线了什么」「这家云厂商刚出过什么故障」比「媒体写了什么」
# 更有用，而聚合器结构上不收这些——它们不是「新闻」。
#
# 这些源的共同点：都是当事方自己发布的，都有现成 RSS/Atom（GitHub 的
# `releases.atom`、Statuspage 的 `history.rss`、SEC 的 `.rss`），现有 rss
# connector 直接吃，不需要第三个 connector。
#
# 代价是它们天然单来源单信号：一次发版、一次故障极少被第二个源印证。
# 因此**不能让它们进 Rising**——Rising 排的是 recent_source_count（跨源扩散），
# 而这些源恒为 1，进去只会把真正在扩散的事件挤下去（见 rising-signal.spec.yaml）。

# ---------- 必填 ----------
module: events
surfaces: [tenant, ssr]
goal: EVENT_SOURCE_KINDS 扩出 release / status / filing 三类非新闻源；内置目录补齐这三类；Rising 只收会被跨源跟进的类型，Now / 实体页 / 订阅全收；工作台可配、公开面可按类型筛。
gold: modules/events/server/ingest/feed-catalog.ts
touch:
  - modules/events/features/non-news-sources.spec.yaml
  - modules/events/MODULE.md
  - modules/events/models.prisma
  - apps/server/prisma/migrations/20260819100000_events_non_news_sources/
  - packages/server-kernel/src/generated/prisma/client/ # prisma generate 产物
  # 枚举、一手来源判据、Rising 闸门、聚类口径的真源
  - modules/events/shared/events.ts
  - modules/events/shared/events.test.ts
  - modules/events/shared/public-view.ts
  - modules/events/shared/events-section-context.ts
  - modules/events/shared/events-sample.ts
  # 所有把 source_kind === "official" 当「一手来源」用的地方
  - modules/events/server/event/why-trending.ts
  - modules/events/server/event/why-trending.test.ts
  - modules/events/server/event/heat.ts
  - modules/events/server/event/topic-classifier.ts
  - modules/events/server/event/analyzer/heuristic-analyzer.ts
  - modules/events/server/event/analyzer/llm-analyzer.ts
  # 聚类：非新闻源只按 canonical_url 归属
  - modules/events/server/event/cluster.service.ts
  - modules/events/server/event/title-tokens.test.ts
  - modules/events/server/ingest/ingest.service.ts
  # source_kinds 冗余列的写入与读取
  - modules/events/server/event/event-refresh.service.ts
  - modules/events/server/event/event.mapper.ts
  - modules/events/server/event/event.mapper.test.ts
  - modules/events/server/event/event.service.ts
  - modules/events/server/ssr/public-events.service.ts
  - modules/events/server/ssr/events-path-handler.ts
