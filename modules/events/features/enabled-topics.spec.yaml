out_of_scope:
  - 改 EVENT_TOPICS 枚举本身（不加自定义主题，不做主题 CRUDL）
  - 分类器仍按七格判定；关掉的格子只是不展示，不把体育新闻硬塞进科技
  - 平台控制台 /platform
  - 工作台改事件主题 / 采集源主题下拉仍是七格（关掉的事件还能改回去）
  - 关掉主题时不改 EventFeed.enabled（源自己的开关是用户意图，主题回来后按它恢复）
  - 存量 chrome 回填（页头条目跟着 nav_topics 走，不用改库）
i18n: code
