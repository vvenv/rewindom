# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
# 1. TenantSetting key = events.enabled_topics，值是 EventTopic[]。
#    缺行 / 非法 / 空数组 → 读路径全开（失效方向：宁可多显示）。
#    写入至少 1 个合法格子，顺序固定为 EVENT_TOPICS。
# 2. 不做独立主题 CRUDL 页：格子不是租户自建分类。开关落在采集源页，
#    源按主题分组，组头就是主题开关——「关掉体育 = 这组源不采了」一眼能看出来。
# 3. 有效采集 = 主题开着 且 源 enabled。关掉主题不写 EventFeed.enabled。
#    采集查询带 enabledTopicWhere；界面上该组源的开关显示为关且不可拨。
# 4. 公开面：nav_topics / Rising / Now / 列表 / RSS / sitemap / 实体页事件
#    只含启用格子。关掉的 /events/:topic、?topic=、以及该主题下的 /events/:slug
#    一律 404。工作台详情仍可打开，方便改主题。
#    事件模板页（含把 /events 设为首页后的 /）由 path handler 渲染，必须自己带
#    nav_topics；漏了页头会按失效方向退回七格。
# 5. 目录种植：只种启用 topic 的源；未启用的 key 不记「已种」，以后打开再补。
# 6. 工作台探索 feed 与公开面同口径；「全部事件」仍能看到关掉格子里的存量，方便改主题。
