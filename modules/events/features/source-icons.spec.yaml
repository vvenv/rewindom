# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
#
# 1. icon 代表**发行人**（采集源），不是文章域名。
#    HN 的信号 URL 是目标站，拿它当 favicon 会在「Hacker News」旁边画出 OpenAI
#    的标——名实不符。主机名从 EventFeed.url + connector 推，按 source_name
#    贴到事件卡片 / 时间线 / 来源列表上。
#
# 2. 推导是纯函数，放 shared/source-icon.ts（SSR 与工作台同一份）：
#    connector === hackernews → news.ycombinator.com
#    其余取 URL hostname，去掉 www.；feeds./feed./rss./search. 前缀剥掉
#    （feed.infoq.com → infoq.com）。剥完仍不是品牌域的进显式别名表
#    （feeds.bbci.co.uk → bbc.com、githubstatus.com → github.com）。
#    解析失败 → 不画，不占位。
#
# 3. 公开页取图地址是本站 `/events/icons/{host}`，**不是** Google s2。
#    工作台 `<img>` 不带 JWT、开发态 Vite 默认只代理 HTML，所以工作台走
#    `/api/public/tenants/{slug}/events/icons/{host}`（与站点媒体库同一套）。
#    访客浏览器只打我们的源；服务端用 ingest 那条 HTTP 出口去
#    `https://{host}/favicon.ico`，不行再读首页 `<link rel="icon">`。
#    只代理光栅图（ico / png / gif / webp / jpeg），**不代理 SVG**——
#    字节从本站源发出，SVG 即代码。
#    img：alt=""（名字在旁边）、loading=lazy、onerror 摘掉。
#    Cache-Control 一天；进程内 LRU，未命中负缓存一小时避免打爆源站。
#
# 4. SSRF：只为**本站 EventFeed 推出来的 host** 去抓。路径上的 host 必须过
#    `isIconHost`（有点的公网主机名，拒 IP / localhost / .local）。
#    未在本站源列表里的 host → 404，一次出站都不发。
#
# 5. 与 RSS / og.png 同一条 path handler，locale 前缀与 entitlement 闸门白拿。
#    `/events/icons/openai.com` 是三段，不会撞 `/events/:slug`。
#
# 6. 读路径多一次 `EventFeed.findMany`（每站 ~70 行）做成 name → 本站 icon 路径
#    索引，不往 NewsEvent 加并行数组。工作台采集源列表自己就有 url + connector。
#
# 7. 卡片仍保留 source_names（RSS / og / 修订快照继续用纯文字）。
#    新增同序的 source_icon_urls：(string | null)[]，对不上的源该项为 null。
#    EventSourceItem / EventTimelineItem / EventFeedItem / 公开视图各加 icon_url。
