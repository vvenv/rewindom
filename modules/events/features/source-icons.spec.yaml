# 来源名旁边显示站点 favicon。新闻聚合器的标准做法：扫卡片时先认出发行人。
#
# 取图**不能**走 Google s2（`www.google.com/s2/favicons`）——这个地址不是全球
# 可达（国内尤其），公开页一旦依赖它，图标会整批裂掉。访客只请求本站；
# 由服务端用采集那条 HTTP 出口去源站拉 favicon，内存缓存后同源吐出。

# ---------- 必填 ----------
module: events
surfaces: [tenant, ssr]
goal: 来源名旁显示站点 favicon（公开卡片 / 详情来源与时间线 / 工作台采集源列表与事件详情）。img 同源 `/events/icons/{host}`，服务端从发行人源站取图并缓存；不依赖 Google s2 或其它第三方图标 CDN。
gold: modules/events/shared/sections/feed-html.ts
