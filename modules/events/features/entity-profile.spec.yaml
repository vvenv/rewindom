# 实体页现在是「这是谁 + 它涉及哪些事件」——一个按时间排的列表。
#
# 但实体页真正的价值在**累计**，不在列表：技术负责人要的不是「Cloudflare 最近有哪些
# 新闻」，是「这家近 90 天出过几次故障、累计多久」。那是续约谈判、事故复盘、选型评审
# 上拿得出手的证据，而今天没有人给他——状态页自己会清历史，且只显示自己那一家。
#
# 上一期的归位已经把这个查询写出来了，只是按事件问；这一期换成按实体问。
# 同样零新表、零模型调用。
#
# 竞品给不出：聚合器没有实体级的结构化记录，它们的实体页就是一个搜索结果。

# ---------- 必填 ----------
module: events
surfaces: [ssr]
goal: 公开实体页在名字下面给出近 90 天的累计档案——一共几件事、按类型各几次、故障累计多少分钟。全部由已有列查出来。
gold: modules/events/server/event/placement.service.ts
touch:
  - modules/events/features/entity-profile.spec.yaml
  - modules/events/MODULE.md
  - modules/events/server/event/entity-profile.service.ts
  - modules/events/server/event/entity-profile.service.test.ts
  - modules/events/server/event/placement.service.ts # 导出窗口常量，两处不许漂移
  - modules/events/server/ssr/public-events.service.ts
  - modules/events/server/ssr/events-path-handler.ts
  - modules/events/shared/events-section-context.ts
  - modules/events/shared/sections/entity-html.ts
  - modules/events/shared/sections/entity-html.test.ts
  - modules/events/shared/site-css/events.css
  - modules/events/client/locales/en.json
  - modules/events/client/locales/zh-CN.json
out_of_scope:
  - 新表 / 新列 / migration
  - 工作台的实体管理页（合并 / 改名 / 删除）——MODULE.md 记着别名合并要人来定
  - 实体索引页 `/events/entity`
  - 跨实体对比（A 家 vs B 家的累计故障时长）——独立一期
  - 段设置开关（档案是实体身份的一部分，不做成可关的板块）
i18n: code
acceptance:
  - pnpm --filter @rewindom/events exec vitest --run server/event/entity-profile.service.test.ts
  - pnpm --filter @rewindom/events exec vitest --run
  - node scripts/verify-module.mjs events
  - pnpm check:i18n
  # 实测（Cloudflare，本地库）：近 90 天 19 件事、kind 全为 null，
  # 档案正好只渲染一行「近 90 天 19 件事」——「判不出类型只计入总数」这条分支
  # 在真实数据上验过。类型行要等下一轮采集把 kind 算出来，单测已覆盖
  - 在本地库上对若干实体核对计数

# ---------- 可选 ----------
entitlement: events
permissions: [] # 公开面，沿用 path handler 的 entitlement 闸门
models: []

# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
#
# 1. 一次 `groupBy(['kind'])` 拿全部：`_count` 给各类型次数，
#    `_sum.fact_duration_minutes` 给故障累计。不要按类型各查一次。
#
# 2. **窗口必须与归位共用同一个常量**（从 `placement.service` 导出）。
#    详情页说「近 90 天第 4 次」而实体页按 60 天算，两个数字对不上会立刻被发现，
#    而这种漂移一旦发生极难查。
#
# 3. **过滤条件也必须与实体页的事件列表一致**（`enabledTopicWhere`）：
#    档案里数了 12 件事、下面的列表只列出 8 件，读者会以为页面坏了。
#
# 4. 判不出类型的事件（`kind = null`）**只计入总数，不单独列一行**。
#    「未分类 806 次」不是一个类型，写出来只是把「我们判不出来」放大成一个品类。
#
# 5. **总数 < 2 时整块不渲染**。「近 90 天 1 件事」是噪音——而实体图里大量实体
#    只关联一个事件（实体抽取保守，长尾很长）。
#
# 6. 与归位、why-trending 同一条：产出 i18n code + 参数，**不是自由文案**。
#    只报计数与时长，不写「比上季度更稳定」这类比较——那是判断，不是事实。
#
# 7. 渲染在实体名下面、事件列表上面，**不给段开关**：它是这个实体的身份，
#    不是一个可关的板块（与归位同一条理由）。
#
# ---------- 下一步（不在本期）----------
# - 跨实体对比：同一主题下几家的累计故障时长排行。是选型评审真正想要的那张表，
#   但它需要一个新的公开面（页面或段），是产品决策不是本期的增量
# - 「报了但官方没认」：有 news 信号但窗口内该实体没有 official/status/release 信号
