out_of_scope:
  - AI 写「影响」「意义」「为什么重要」（自由文案，越过 MVP §11）
  - 公开绝对热度分 / 名次 / 媒体等级
  - 模型给事件标萌芽 / 发酵 / 爆发
  - 通栏头条 / 改变 Rising·Now 取数
  - 在每张薄卡上印「仅讨论」（13/16 张 HN 会变成整页报警）
  - 预计算归位落库（读路径批量查，与详情同一套 buildPlacementFacts）
  - RSS 条目形态（仍用 headline，不跑归位查询）
i18n: code
acceptance:
