# 列表卡片厚薄分流——把能当简报用的那一行从详情拿到卡片上。
#
# 首页 16 张卡几乎一个模子，真正值钱的东西（归位、已证实、类型事实）全藏在详情里。
# 访客扫的是一张热榜，不是一份简报。AI 写「影响 / 意义」越过 MVP §11，
# 公开热度分会变回热榜。正确的抓眼球方式是**对比**：少数厚卡打断网格。

# ---------- 必填 ----------
module: events
surfaces: [tenant, ssr]
goal: 公开列表与工作台卡片按「有没有可核对的证据」分成厚卡 / 薄卡。薄卡只留标题与来源；厚卡把最多一句证据（归位优先，否则已证实 · N 家来源）做成角标排进标题上方的 meta 行，已有的类型事实 chips 仍画。不写影响解读、不上热度分、不标萌芽→爆发。
gold: modules/events/shared/events.ts
touch:
  - modules/events/features/thick-thin-cards.spec.yaml
  - modules/events/MODULE.md
  - modules/events/shared/events.ts
  - modules/events/shared/events.test.ts
  - modules/events/shared/events-sample.ts
  - modules/events/shared/events-section-context.ts
  - modules/events/shared/public-view.ts
  - modules/events/shared/public-view.test.ts
  - modules/events/shared/sections/event-card-html.ts
  - modules/events/shared/sections/feed-html.ts
  - modules/events/shared/sections/feed-html.test.ts
  - modules/events/shared/sections/entity-html.ts
  - modules/events/shared/sections/entity-html.test.ts
  - modules/events/shared/sections/detail-html.test.ts
  - modules/events/shared/site-css/events.css
  - modules/events/shared/site-css.generated.ts
  - modules/events/server/event/placement.service.ts
  - modules/events/server/event/placement.service.test.ts
  - modules/events/server/event/list-items.ts
  - modules/events/server/event/event.mapper.ts
  - modules/events/server/event/event.mapper.test.ts
  - modules/events/server/event/event.service.ts
  - modules/events/server/ssr/public-events.service.ts
