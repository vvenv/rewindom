# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
#
# 1. **厚卡条件**（满足任一）：有证据，或有类型事实 chips。
#    薄卡：标题 + 来源。不要 status / topic / headline / momentum。
#    厚卡：证据角标（若有）+ chips + momentum（若有）+ 标题 + 来源。headline 仍不下卡片——
#    那是详情「发生了什么」的活。工作台额外保留相对时间与 hasUpdate。
#    证据做成角标、排进标题上方的 meta 行（accent 描边、不铺色）。句子跟在标题下面
#    会被当成副标题扫过去；跟 chips 同排才扫得见。
#
# 2. **证据行最多一句**，优先级：
#    placement.kindRecurrence → placement.recurrence → card.confirmedSources（已证实且 ≥2 家来源）。
#    不把 previous / outageTotal 搬上卡片（那是详情的第二、三行）。
#    「仅讨论」不上卡片。
#
# 3. **confirmed 不调 why-trending、不载入信号**。列表已有 source_count / source_kinds：
#    有一手来源，或 ≥2 家且不是纯 community。source_kinds 为空时不猜。
#
# 4. **归位批量查**，不是 N×3。`getEventPlacementsForList` 一次拉主实体、一次拉窗口内
#    同伴事件，然后走与详情同一份 `buildPlacementFacts`。首页 Rising+Now 合成一批。
#    没有实体或第一次出现 → 空数组，卡片保持薄（除非有 chips）。
#
# 5. 公开 feed / 实体页 / 工作台列表共用 `pickCardEvidence` + 同一份卡片 markup
#    （`event-card-html.ts`）。两处各写一份必然漂移。
#
# 6. 产出 i18n code + 参数，不是自由文案。kindRecurrence 的 `kind` 仍是嵌套 code。
