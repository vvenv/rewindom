# 97.8% 的事件终生只有一条信号（本地语料实测：833 个事件里 815 个，跨源的只有 12 个），
# 所以「跨源合并 → 重建时间线」这条主承诺只对 1.4% 的语料生效。剩下那些交付的是：
# 一个标题（= 那篇文章的标题）、一段 og:description、和一条只有一行的时间线。
#
# 提高合并率这条路已经量到头了（IDF 加权收益 0 已撤、语义 0.85 已校准、实体兜底
# 实测「救回 0 对、误并 1 对」）。97.8% 的成因是语料本身——HN topstories 就是几十件
# 互不相干的事。**这是事实，不是缺陷。**
#
# 所以价值不能只压在「合并」上，要压在**抽取**：一条单来源的报道，把埋在正文里的
# 那几个关键事实拎出来、标上类型，它就比原文有用。而抽取一条信号也能做。
#
# 硬约束：三道省钱闸门里第一道就是 EVENTS_LLM_MIN_SIGNALS=2，
# **任何依赖 LLM 的内容改进按设计永远碰不到那 97.8%**。所以判定与抽取必须在
# 规则实现里成立，LLM 只能是「有 key 时更准」的增强。

