# 公开地址口径收口：feed / og.png 跟着挂载走，主题 feed 改成路径段。
#
# 两个毛病同源——RSS 与 og.png 走的是模块自己的 Fastify 路由，而 `homePath` /
# `homeLayoutKey` 只有 path handler 收得到，那两条路由**天生**看不见挂载：
#
#   1. 主题 feed 是 `?topic=ai`，而同一个模块早就定死「topic 必须是路径段」
#      （topicPath 的注释：页头高亮靠 currentPath 精确匹配，查询串进不去）。
#      同一个域里主题一会儿是段一会儿是参数。
#   2. 根挂载的站点上实体页是 `/entity/openai`，页面上那颗订阅按钮却指向
#      `/events/entity/openai/feed.xml`——前缀在旁边所有链接上都已经 301 掉了。
#
# 在模块内部补 Fastify 路由补不动：根挂载的 `/ai/feed.xml` 与带语言前缀的
# `/en/feed.xml` 在 find-my-way 里是**同一个路由模式**，注册第二条直接抛重复路由。
# 所以把 `SitePathHandler.render` 扩成可回非 HTML，feed / og 并回 path handler，
# 挂载感知、locale 剥离、entitlement 闸门、旧前缀 301 全部白拿。

# ---------- 必填 ----------
module: events
surfaces: [ssr]
goal: feed.xml 与 og.png 跟随枢纽挂载（根挂载时不带 /events 前缀），主题 feed 从 ?topic= 改成路径段 /events/:topic/feed.xml，实体段 entity → entities；三者并入 path handler，删掉模块自挂的 rss / og Fastify 路由。
