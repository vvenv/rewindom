  - 给 `/events/entity/*` → `/events/entities/*` 留 301（产品决定不留：已收录的实体页直接 404，累计权重作废。风险已提示）
  - 枢纽页自己的 `?topic=` 接管与 canonical（那是列表页的既有行为，不在本次）
  - `?source=` / `?kind=` 列表查询串改成路径段（它们不是导航项）
