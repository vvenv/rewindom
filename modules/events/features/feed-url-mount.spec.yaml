# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
# 1. marketing 侧只扩一个返回类型，不新增注册表：
#    `SitePathHandler.render` / `SitePathFallback.render` 从 `string | null`
#    扩成 `string | SitePathResponse | null`，
#    `SitePathResponse = { body: string | Buffer; content_type: string; cache_control?: string }`。
#    HTML 仍可直接回字符串（既有 handler 一行不改）。
# 2. 地址表（左=默认，右=枢纽当首页）：
#      /events/feed.xml                    → /feed.xml
#      /events/:topic/feed.xml             → /:topic/feed.xml
#      /events/entities/:slug/feed.xml     → /entities/:slug/feed.xml
#      /events/:slug/og.png                → /:slug/og.png
#    旧前缀由既有 `canonicalRedirect` 301，不写第二套。
# 3. `parseEventsPublicPath` 里那句「明确让开 /feed.xml」的特判**删掉**——
#    它是路由分家时的补丁。feed / og 变成正经路由类型
#    （`feed` / `entity_feed` / `og_image`），后缀先剥、再按基地址判：
#    只有枢纽、主题格、实体页三种基地址有 feed；只有事件详情有 og.png。
#    `/:slug/feed.xml`（单条事件）与 `/:topic/og.png` 一律 null → 404，
#    不存在的东西不要生成一个空 feed。
# 4. 实体段改复数：这一段同时是实体枢纽（`/events/entities` 列出全部实体），
#    而本模块的规矩是「复数集合段 + 条目挂在它下面」（`/events` 与 `/events/:slug`）。
#    段名是 `EVENTS_ENTITY_SEGMENT` 一个常量，路径全部由它派生。
# 5. og.png 跟着挂载走是本次**明确的口径变更**：MODULE.md 里
#    「不跟着首页挂载收到根上」那段要改写，不要留两处打架的说明。
#    旧地址仍由前缀 handler 接住并 301，已被 Slack / Twitter 抓过的卡片不断。
# 6. 频道标题仍用**站点名**（`getSiteChromeOrFallback`），不是租户 slug——
#    那一行是订阅者在阅读器侧边栏里永久看到的东西。
#    `self_url` 用 `origin + withSiteLocale(servedPath)`，不再拼 `request.url`：
#    servedPath 本来就是终态地址，也顺手把查询串甩掉。
# 7. 订阅取址（`eventsSubscribeHref`）读 `context.index_path`，
#    `toPublicEntity` 的 `feed_href` 补 `indexPath` 参数——
#    根挂载时页面上所有链接同一套前缀，这是本次的主诉。
# 8. 编辑器链接下拉（`eventsLinkTargets`）仍存 `/events/...` 的**页身份**地址，
#    不随首页改（`link-target-rss.spec.yaml` 既有口径），落地交给 301。
#    但主题项要从 `?topic=` 换成路径段，否则存进 setting 的是个已废弃的地址。
