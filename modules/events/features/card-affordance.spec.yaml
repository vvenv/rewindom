entitlement: events
permissions: []
models: []

# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
# 1. 整块可点用 stretched-link：`.events-card{position:relative}` +
#    `.events-card-link::after{inset:0}`。**不改 markup**——SSR 与编辑器预览共用同一份
#    渲染器，动结构要同时改详情页与实体页。覆盖层吃掉来源行的文本选中，这是这个
#    模式的既定代价，换的是整张卡都能点。
# 2. 焦点画在**卡片**上不是链接上：`.events-card:has(.events-card-link:focus-visible)`
#    加 accent 描边，链接自己的 outline 清掉。仓库里 `:has()` 已经在用（chrome-row、
#    source-icon-slot），不另做兜底。
# 3. 来源行 `margin-top:auto` 沉到卡底。同排等高是 grid 给的，内容顶对齐是空心的根因；
#    标题在上、来源在下，一排卡才有共同的下边线。只在 `.events-card` 里生效，
#    详情页的 `.events-sources` 不动。
# 4. 悬停只给描边 + 阴影，不给位移。一屏十五张卡各自抬 3px 是抖动不是反馈
#    （marketing 那条 `translateY(-3px)` 是给整段色块的，一页只有一两块）。
# 5. 实体胶囊是**链接**，按链接给尺寸：padding 抬到 ~28px 高、chips 间距 0.5rem、
#    悬停填 accent 淡底。卡片 meta 行里的 `.events-status/.events-topic/.events-fact/
#    .events-evidence` 不是链接，保持 `1px 8px` 的紧凑角标不动。
# 6. 重复只砍**字面重复**那一对：证据行是 `card.confirmedSources`（已证实 · N 家）
#    时，把 `spreading`（N 家在跟进）收掉——同一个 N 说两遍，底下还列着 N 个来源名。
#    `placement.*` 的证据行（「Ukraine：90 天内 17 件」）与 spreading 说的不是一件事，留着。
#    `rising` / `falling` 的百分比也留着。
# 7. 只用官网 token（--surface / --border / --muted-fg / --accent / --accent-text /
#    --fg / --radius），见 `site-section-css` rule。强调色的**笔画**一律走
#    `--accent-text`（暗色下 --accent 只有 2.82:1，见 marketing 的
#    `accent-text-contrast` spec）；淡底填充仍用 --accent。
# 8. 时间：`last_activity_at` 本来就在卡片数据上，从来没画过——一张事件雷达的卡片
#    不说「什么时候」，读者没法判断这条还算不算数。落成文案在 `toPublicCard`
#    （渲染器同步、拿不到 i18n），挂在**来源行末尾**而不是另起一行：
#    它和来源同属「这条材料的出处与新旧」，薄卡也因此终于有了第二个可读信息。
#    读者看「3 小时前」，爬虫读 `<time datetime>` 的绝对时刻。
# 9. 「查看全部」按 tab 各写一句：升温与正在发生同页并排，原来两句都是
#    「See all events」，指向不同地址却长得一模一样。通用 feed 段没有 tab，留泛的那句。
# 10. 标题里的长 token（git ref / hash / URL）要能断：`.events-card-link` 归零
#    `min-width`（flex 项默认不能窄于 min-content，会被从内部顶破），标题用
#    `overflow-wrap: anywhere` 而不是 `break-word`——只有前者把断行算进 min-content，
#    网格轨道才不会被一串 hash 撑宽、把同排的卡一起挤变形。
# 11. 悬停下划线压到 1px + 兑掉 65% 的色 + 推离基线 3px：默认那条实心线在
#    1.125rem 粗体标题上太重，一屏十几张卡扫过去像在闪。
