# 增量功能契约 —— 实体索引页 + 事件详情上的实体链接
#
# 起因：yestino.com 线上 sitemap 里 500 张实体页，站内**一条链接都没有**
# （`curl` 首页与任意事件详情页，`/entity/` 出现 0 次）。它们只靠 sitemap 被发现，
# 是标准的孤儿页——Google 对没有内链的页面给的权重极低，而实体页恰恰是这个站
# 最该被反复回访的一面（事件 24h 就凉，实体不会）。
#
# entity-pages.spec.yaml 当时把索引页写进 out_of_scope（「先有单页，聚合页看有没有人要」）。
# 现在要开始推广，答案是要：孤儿页问题只有「详情页链过去 + 有一张枢纽」两件事一起做才解得开。
#
# 两条内链方向缺一不可：
#   - 事件详情 → 实体（~500 张页面各带几条，这是权重的主要来源）
#   - 实体枢纽 → 全部实体（给爬虫一条能一次爬完的路，也给人一个可浏览的入口）

# ---------- 必填 ----------
module: events
surfaces: [ssr]
goal: 事件详情页渲染它涉及的实体并链到实体页；新增实体枢纽模板页（`/events/entity`，枢纽当首页时 `/entity`）按类型列出本站实体，并进 sitemap 与页头页脚导航源。
gold: modules/events/shared/sections/entity-html.ts
touch:
  - modules/events/features/entity-index.spec.yaml
  - modules/events/MODULE.md
  - modules/events/shared/events-section-context.ts
  - modules/events/shared/events-entity-index-section.ts
  - modules/events/shared/events-page-templates.ts
  - modules/events/shared/index.ts
  - modules/events/shared/nav-sources.ts
  - modules/events/shared/public-view.ts
  - modules/events/shared/sections/detail-html.ts
  - modules/events/shared/sections/detail-html.test.ts
  - modules/events/shared/sections/entity-index-html.ts
  - modules/events/shared/sections/entity-index-html.test.ts
  - modules/events/shared/site-css/
  - modules/events/server/event/entity.service.ts
  - modules/events/server/ssr/public-events.service.ts
  - modules/events/server/ssr/events-path-handler.ts
  - modules/events/server/sections/register.ts
  - modules/events/client/locales/
out_of_scope:
  - 实体的搜索 / 分页（先按最近活动截断到一屏可读的量）
  - 实体消歧与别名合并（Meta / Facebook 仍是两个实体，见 entity-pages.spec.yaml）
  - 工作台的实体管理界面
  - 关注实体的入口改动（entity-follow 那套不动）
  - 「相关实体」共现图（要另一套数据，且极易变成噪声链接）
i18n: code # 段设置、类型分组名走 client/locales；实体名本身是数据不翻译
acceptance:
  - pnpm --filter @rewindom/events exec vitest --run
  - node scripts/verify-module.mjs events
  - pnpm check:i18n
  - pnpm --filter @rewindom/builtin check:section-css

# ---------- 可选 ----------
entitlement: events
permissions: [] # 公开面，无需权限
models: [] # 实体与关联表都已存在（entity-graph / entity-pages）

# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
# 1. 枢纽路径复用实体前缀：`/events/entity`（枢纽当首页时 `/entity`）。
#    `parseEventsPublicPath` 必须**先**认这个精确路径，否则挂在根上时
#    `/entity` 会被 `singleSegmentFromPath` 当成一个叫 entity 的事件 slug。
# 2. 详情页的实体不给段开关：与「归位」同一条口径——它是这条材料的身份而不是一个板块，
#    多一个 `show_entities` 只会让段设置更长。空数组时整块不渲染。
# 3. 枢纽只收**最近 30 天还有事件**的实体，与实体 sitemap 同一条口径；
#    陈年实体页仍可访问，只是不进枢纽也不进 sitemap。
# 4. 枢纽自己要进 sitemap，但**不能靠 marketing 的页面清单**：枢纽当首页时
#    `/events/*` 整段被收到根上并 301，模板页那一行会被过滤掉（见
#    marketing 的 sitemap-only-canonical-urls）。所以由 events 的 sitemap provider
#    按当前挂载算出终态地址交进去。
# 5. 导航源 `events.entities` 是一条叶子：租户可以把它放进页头或页脚。
#    不默认塞进现有 `events` 源——那个源是七个主题格，混一条进去会打乱它的语义。
