# 增量功能契约 —— 内容素材上传改用统一的 FileDropZone

# ---------- 必填 ----------
module: content
surfaces: [tenant]
goal: 新建抽屉与素材编辑器的裸 <input type=file> 换成 FileDropZone + FileList，支持拖放 / 粘贴 / 点选，并显示已选文件体积与移除。
gold: packages/client-kit/src/components/FileDropZone.tsx
touch:
  - modules/content/features/unified-file-drop.spec.yaml
  - modules/content/client/components/ContentCreateSheet.tsx
