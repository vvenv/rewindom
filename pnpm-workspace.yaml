packages:
  - "apps/*"
  - "packages/*"
  - "modules/*"
overrides:
  fastify: 5.11.3
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
minimumReleaseAge: 0
