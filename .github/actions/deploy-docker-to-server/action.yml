# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Deploy Docker to server
description: Upload source tarball and run docker compose build on remote server

inputs:
  environment:
    description: Target deploy environment (production or test)
    required: true
  ssh_host:
    description: SSH host
    required: true
  ssh_user:
    description: SSH username
    required: true
  ssh_key:
    description: SSH private key (设了就优先于密码)
    required: false
    default: ""
  ssh_password:
    description: SSH password
    required: true
  bootstrap:
    description: First-time bootstrap with Nginx and SSL
    required: false
    default: "false"
  env_only:
    description: Only sync env file and restart containers
    required: false
    default: "false"
  db_password:
    required: true
  jwt_secret:
    required: true
  tenant_secret_encryption_key:
    required: true
  app_domain:
    required: true
  app_port:
    required: false
    default: ""
  ssl_email:
    required: false
    default: ""
  openai_api_key:
    required: false
    default: ""
  openai_base_url:
    required: false
    default: ""
  openai_model:
    required: false
    default: ""
  redis_password:
    required: false
    default: ""
  platform_admin_username:
    required: false
    default: ""
  platform_admin_password:
    required: false
    default: ""
  site_csp_mode:
    description: 公开面 CSP 模式（off/report/enforce）；留空用 compose 默认 report
    required: false
    default: ""
  backup_offsite_dest:
    description: 备份异地目标（s3:// 或 rclone 远端）；写进服务器 /etc/rewindom/backup.env
    required: false
    default: ""
  log_level:
    required: false
    default: ""

runs:
  using: composite
  steps:
    # 密钥优先：deploy-remote.sh 是「先试密钥，失败再用密码」，
    # 所以把私钥放进 ~/.ssh 就够了，不必改部署脚本本身。
    # 没配 DEPLOY_SSH_KEY 时这一步整个跳过，行为与从前一致。
    - name: Set up SSH key
      if: inputs.ssh_key != ''
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_HOST: ${{ inputs.ssh_host }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        {
          printf 'Host %s\n' "$SSH_HOST"
          printf '  IdentityFile ~/.ssh/id_deploy\n'
          printf '  IdentitiesOnly yes\n'
        } >> ~/.ssh/config
        chmod 600 ~/.ssh/config
        # 固定主机指纹，避免回落到交互式确认（BatchMode 下那等于直接失败）
        ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

    - name: Install sshpass
      if: inputs.ssh_password != ''
      shell: bash
      run: |
        if ! command -v sshpass >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
        fi

    - name: Write deploy env file
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        DEPLOY_HOST: ${{ inputs.ssh_host }}
        DEPLOY_SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_SSH_PASSWORD: ${{ inputs.ssh_password }}
        DB_PASSWORD: ${{ inputs.db_password }}
        JWT_SECRET: ${{ inputs.jwt_secret }}
        TENANT_SECRET_ENCRYPTION_KEY: ${{ inputs.tenant_secret_encryption_key }}
        APP_DOMAIN: ${{ inputs.app_domain }}
        APP_PORT: ${{ inputs.app_port }}
        SSL_EMAIL: ${{ inputs.ssl_email }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        OPENAI_BASE_URL: ${{ inputs.openai_base_url }}
        OPENAI_MODEL: ${{ inputs.openai_model }}
        REDIS_PASSWORD: ${{ inputs.redis_password }}
        PLATFORM_ADMIN_USERNAME: ${{ inputs.platform_admin_username }}
        PLATFORM_ADMIN_PASSWORD: ${{ inputs.platform_admin_password }}
        LOG_LEVEL: ${{ inputs.log_level }}
        SITE_CSP_MODE: ${{ inputs.site_csp_mode }}
      run: |
        set -euo pipefail
        case "$ENVIRONMENT" in
          production) env_file=".env.production" ;;
          test) env_file=".env.test" ;;
          *) echo "Unsupported environment: $ENVIRONMENT"; exit 1 ;;
        esac
        # 可选项：为空就不写这一行。
        #
        # **不要**写成 `[ -n "$X" ] && printf ...`：那在 `set -e` 下是个位置陷阱——
        # 条件为假时该行返回 1，如果它恰好是 `{ }` 组里的最后一条命令，整组就以 1
        # 退出，步骤直接失败。不在最后一行时反而没事，所以这个 bug 会随着「谁排最后」
        # 悄悄出现和消失。一次真实部署就挂在 LOG_LEVEL 没配上。
        emit_optional() {
          [ -n "$2" ] || return 0
          printf '%s=%s\n' "$1" "$2"
        }

        {
          # 必需项无条件写；缺了会被 validate-deploy-secrets 提前拦住
          printf 'DEPLOY_HOST=%s\n' "$DEPLOY_HOST"
          printf 'DEPLOY_SSH_USER=%s\n' "$DEPLOY_SSH_USER"
          printf 'DEPLOY_SSH_PASSWORD=%s\n' "$DEPLOY_SSH_PASSWORD"
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
          printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
          printf 'TENANT_SECRET_ENCRYPTION_KEY=%s\n' "$TENANT_SECRET_ENCRYPTION_KEY"
          printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN"

          emit_optional APP_PORT "$APP_PORT"
          emit_optional SSL_EMAIL "$SSL_EMAIL"
          emit_optional SITE_CSP_MODE "$SITE_CSP_MODE"
          emit_optional OPENAI_API_KEY "$OPENAI_API_KEY"
          emit_optional OPENAI_BASE_URL "$OPENAI_BASE_URL"
          emit_optional OPENAI_MODEL "$OPENAI_MODEL"
          emit_optional REDIS_PASSWORD "$REDIS_PASSWORD"
          emit_optional PLATFORM_ADMIN_USERNAME "$PLATFORM_ADMIN_USERNAME"
          emit_optional PLATFORM_ADMIN_PASSWORD "$PLATFORM_ADMIN_PASSWORD"
          emit_optional LOG_LEVEL "$LOG_LEVEL"
        } >"$env_file"

    - name: Deploy via Docker
      shell: bash
      env:
        # 备份的异地目标不是机密（是个路径），走 variables 即可。
        # 部署脚本会把它写进服务器的 /etc/rewindom/backup.env——
        # cron 跑备份时进程环境是空的，只有落到文件里才读得到。
        BACKUP_OFFSITE_DEST: ${{ inputs.backup_offsite_dest }}
      run: |
        set -euo pipefail
        chmod +x scripts/docker-deploy-remote.sh
        args=(--env "${{ inputs.environment }}" --yes)
        if [ "${{ inputs.bootstrap }}" = "true" ]; then
          args+=(--bootstrap)
        fi
        if [ "${{ inputs.env_only }}" = "true" ]; then
          args+=(--env-only)
        fi
        bash scripts/docker-deploy-remote.sh "${args[@]}"
