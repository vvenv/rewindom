# 增量功能契约 —— 站点名称 / 标语作为占位符，页面与区块处处可用
#
# 起因：站点设置里的**站名**已经有 `{site}`，**标语**却只在「首页 description 缺省时
# 回落」这一处用得上——想在事件雷达首页版式的页面标题里写「{site} · {tagline}」无从下手。
# 更要命的是插值的**覆盖面**：页面 meta（ssr-render）、chrome 文案与链接（chrome-html）、
# events 首屏（自己抄了一遍）各做各的，普通页面区块（hero / band / prose / page-header）
# 与所有贡献段一个 token 都不认。租户在区块标题里写 `{site}`，前台原样吐花括号。
#
# 第二件事是**占位符没有一个「看得见」的地方**。它此前只以一行字段提示存在
#（`渲染时替换：{year} {site} …`），而那行字回答不了唯一要紧的问题：`{topic_slug}`
# 到底是什么、`{site}` 现在等于什么、这张页面上到底有没有 `{event}`。更糟的是那份清单
# 是**手写**的：`interpolation_tokens` 写在 page kind 上、值填在模块的 values 函数里，
# 两份清单没有任何东西对得上——events 填了七个 token，实体枢纽那张模板一个都没声明，
# `{feed}` 在那张页面上明明可用，编辑器却从来不列。
#
# 口径不变（Hugo / Jekyll / Ghost 同一套，见 chrome-text-placeholders）：只放「写进
# settings 就会过期」的值，一次给齐，不搞别名。

