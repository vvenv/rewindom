  - pnpm --filter @rewindom/builtin exec vitest --run --project marketing/server ssr-seo.test.ts render-page-sections-html.test.ts
  - pnpm --filter @rewindom/events exec vitest --run --project shared sections/hero-html.test.ts
  - pnpm --filter @rewindom/builtin exec vitest --run --project marketing/client SiteChrome.test.tsx
  - pnpm check:i18n
  - pnpm check:modules

