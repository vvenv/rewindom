# ---------- 设计要点 ----------
# 1. `BUILTIN_SITE_TOKENS` = `year` `site` `tagline` `hostname` `url`。页面设置 tip
#    与编辑器区块提示都读这张表，加一项两处自动跟上。
# 2. **插值收口在聚合层**：`renderSectionHtml` / `SiteSections` 拿 `ctx.interpolation`
#    按段的 schema 把设置值过一遍（`link` 走 `interpolateSiteHref`，其余文案类走
#    `interpolateSiteText`），渲染器读到的 `settings` 已经是替换好的。贡献段因此
#    **什么都不用做**就支持 token——以前要自己 import 两个函数抄一遍。
# 3. values 由**根**算一次：`ssr-render`（页头页脚 + 正文）、`renderPageSectionsHtml`、
#    `TenantSiteView`（预览）。内置项来自站点对象与请求 origin，模块项仍走
#    `contributed.interpolation`。
# 4. chrome 的 `{token}` 与段的是同一份 values：`chrome_text` 不再自算一套
#    （`resolveChromeText` 连同 `CHROME_TEXT_TOKENS` 一起删掉，后者早已无人引用）。
# 5. **注册表**（`interpolation-tokens.ts`）：一个 token 一条声明，带 `label`（写给租户
#    看的说明，必须 `ns:key`）、`page_kinds`、`entitlement`。`page_kinds` 摆在 token 这一
#    侧——`{feed}` 长在五张模板上，写在 kind 上要抄五遍，实体枢纽当初就是这么抄漏的。
#    `PageTemplateKindDefinition.interpolation_tokens` 与 `pageMetaInterpolationTokens`
#    一并删除，不留兼容。
# 6. 贡献方在登记 page template 的同一个函数里 `registerInterpolationTokens`，并各钉一条
#    「登记的 key 集合 == values 函数的 key 集合」——这两份清单以前没有任何东西对得上。
# 7. 租户面：编辑器的「可用占位符」面板（页面设置 + 每组含文字/链接字段的区块设置）。
#    站点级 token 直接显示当前值（`{site} → Acme`），点一行复制。它替掉了原来那行
#    `渲染时替换：{year} {site} …`——那行字回答不了「这是什么、现在等于什么」。
# 8. `label` 一律带 ns（含 marketing 自己的）：`check:i18n` 扫 `ns:key` 字面量，
#    漏写文案在门禁上就红（已验证：改成不存在的 key 会让 check:i18n 失败）。
