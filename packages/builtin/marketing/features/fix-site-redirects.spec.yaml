# 站点设置里的重定向对访客不生效

# ---------- 必填 ----------
module: marketing
surfaces: [ssr]
goal: 站点设置里保存的重定向，访客访问来源地址时真正 301/302（含末尾斜杠、语言前缀、贡献路径 404、超过三段的旧 URL）
gold: packages/builtin/marketing/server/ssr.routes.ts
touch:
  - packages/builtin/marketing/features/fix-site-redirects.spec.yaml
  - packages/builtin/marketing/shared/site-locale.ts
  - packages/builtin/marketing/shared/site-locale.test.ts
  - packages/builtin/marketing/shared/site-redirect.ts
  - packages/builtin/marketing/shared/site-redirect.test.ts
  - packages/builtin/marketing/server/site-redirect.service.ts
  - packages/builtin/marketing/server/site-redirect.service.test.ts
  - packages/builtin/marketing/server/ssr.routes.ts
  - packages/builtin/marketing/server/ssr-catch-all.test.ts
  - packages/builtin/marketing/client/locales/zh-CN.json
  - packages/builtin/marketing/client/locales/en.json
  - packages/builtin/marketing/MODULE.md
  - packages/builtin/site-member/server/member-auth.ssr.ts
  - packages/builtin/site-member/server/member-account.ssr.ts
  - packages/builtin/site-member/server/module.ts
  - packages/builtin/site-billing/server/module.ts
out_of_scope:
  - 通配 / 正则重定向
  - 多跳解析
  - 用重定向接管首页 `/`（仍走 home_path 改写）
i18n: code
acceptance:
  - pnpm --filter @rewindom/builtin exec vitest --run marketing/shared/site-redirect.test.ts marketing/shared/site-locale.test.ts marketing/server/site-redirect.service.test.ts marketing/server/ssr-catch-all.test.ts
  - pnpm check:i18n
