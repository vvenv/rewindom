# 增量功能契约 —— 公开面 SEO：title / meta / hreflang / llms.txt / HSTS
#
# 起因：yestino.com Semrush Mega Export（2026-08-19）公开面一批可修的技术项：
#   1. `<title>` 把「页标题 · 站名」拼出去，新闻标题普遍超过 60 字
#   2. 没写 description 的页全部回落同一句 tagline → Duplicate meta descriptions
#   3. 语言切换器 <a hreflang> 与 <head> 里的 alternate 叠两套；noindex 页仍发 hreflang
#   4. `/llms.txt` 404（爬虫按惯例找，找不到记一条）
#   5. 响应没有 Strict-Transport-Security
# 「Missing h1」不修：不为爬虫把页头品牌包成 h1，也不在 <main> 前塞一颗 page-title。
# 标题属于 CMS 段（hero / page-header）；没有就是版式选择。
#
# 内容侧（Low word count / Low text to HTML / 语种检测把中文壳+英文卡片判成英文）
# 不在这次：那是语料与版式，不是缺标签。

# ---------- 必填 ----------
module: marketing
surfaces: [ssr]
goal: 截断 title、去重 description、noindex 不再发 hreflang、提供 /llms.txt，HTTPS 响应带 HSTS。不注入 h1。
gold: packages/builtin/marketing/server/ssr-render.ts
touch:
  - packages/builtin/marketing/features/ssr-seo-audit.spec.yaml
  - packages/builtin/marketing/shared/seo-meta.ts
  - packages/builtin/marketing/shared/seo-meta.test.ts
  - packages/builtin/marketing/shared/reserved-slugs.ts
  - packages/builtin/marketing/shared/site-css/base.css
  - packages/builtin/marketing/shared/sections/_common/styles.css
  - packages/builtin/marketing/shared/sections/_common/chrome-html.ts
  - packages/builtin/marketing/shared/sections/_common/chrome-html.test.ts
  - packages/builtin/marketing/shared/marketing-site-css.generated.ts
  - packages/builtin/marketing/client/components/sections/SiteChrome.tsx
  - packages/builtin/marketing/server/ssr-render.ts
  - packages/builtin/marketing/server/ssr-render.test.ts
  - packages/builtin/marketing/server/ssr-seo.test.ts
  - packages/builtin/marketing/server/ssr.routes.ts
  - packages/builtin/marketing/server/hsts.ts
  - packages/builtin/marketing/server/hsts.test.ts
  - packages/builtin/marketing/MODULE.md
  - apps/client/vite-marketing-ssr-proxy.ts
  - scripts/lib/docker-deploy-remote.sh
  - scripts/acme-helper.py
  - docs/deployment.md
out_of_scope:
  - 为爬虫硬塞 h1（页头品牌、main 前的 page-title、自动 page-header）
  - 抽出内联 CSS 去抬 text-to-HTML 比
  - 给薄内容页注水
  - 改 hreflang 用 zh-Hans 替换 zh-CN
  - HTTP→HTTPS 跳转（certbot --redirect 已做）
i18n: none # 无新工作台文案
acceptance:
  - pnpm --filter @rewindom/builtin exec vitest --run --project marketing/server ssr-seo.test.ts ssr-render.test.ts hsts.test.ts
  - pnpm --filter @rewindom/builtin exec vitest --run --project marketing/shared seo-meta.test.ts
  - pnpm --filter @rewindom/builtin assemble:marketing-css
  - pnpm check:modules

# ---------- 可选 ----------
entitlement: # 无（marketing 是 infra 模块）
permissions: []
models: []

# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
# 1. **不注入 h1**。页头品牌始终是链接；正文标题由段自己出（hero / page-header）。
# 2. **`<title>` 上限 60**：首页用站名；内页能放下 `标题 · 站名` 就拼，否则只用页标题，
#    再长就截断加省略号。og:title 用完整页标题（社交卡片不必跟 SERP 一样短）。
# 3. **description**：页有 description 用它；首页回落 tagline；其它页回落
#    `{title} — {tagline}`，禁止多页共用一句光秃 tagline。
# 4. **hreflang 只留 <head>`**：语言切换器的 <a> 去掉 hreflang，避免与 head 互指打架。
#    `page.settings.noindex` 或 `omitHreflang` 时 head 也不发 alternate。
# 5. **`canonicalPath`**：调用方可覆盖规范地址（事件详情内容未译，指回默认语言 URL）。
# 6. **`/llms.txt`**：与 robots.txt 同级，站点名 + 标语 + 链到 sitemap。
# 7. **HSTS**：SSR onRequest 在 https origin 上加头；宿主机 nginx 每次部署幂等补一条
#    （certbot 写的 443 块不会自己带），acme-helper 新签域名同样补。
