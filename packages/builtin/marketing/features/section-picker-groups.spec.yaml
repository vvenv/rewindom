# 「添加区块」按贡献模块分组。
#
# 菜单现在是一张扁表：marketing 的 Hero、events 的 Hero、events 的 RSS 订阅、
# newsletter 的邮件订阅排在一起，租户分不清点下去会得到哪一段。模板页已经按
# `group` 分过组（同一 key = 同一组），段这边还没有。

