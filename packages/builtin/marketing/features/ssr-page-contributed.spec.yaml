# ---------- 设计要点（实现时按此，偏离先改本 spec）----------
# 1. **合并粒度是模块键内部。** `mergeContributedRecords` 是后来者整键替换；
#    渲染方那份（token、这次点的结果、当前这篇文档）与 provider 那份（页头块要的
#    数据、同页别的段要的数据）说的是两件事，整键盖掉就把页头又打回兜底了。
#    只合一层：`{...provider那份, ...自己那份}`，同名字段自己赢。
#
# 2. **`skipSectionTypes`：自己已经查过的，不许 provider 再查一遍。**
#    店面页已经带着完整购物车与商品，文档页已经带着 docs，事件页已经带着 feed。
#    不跳过就是每张页多打一轮同样的库。newsletter **刻意不跳过**——订阅段的文案表
#    与 `?list=` 范围以 provider 那份为唯一来源（见 newsletter 那份 spec 的要点 2）。
#
# 3. **provider 炸了不许让页面 500。** `resolveSectionContexts` 已经按 provider 吞
#    异常，helper 不再加自己的兜底。退订页少一块页头，好过读者退不掉订阅。
#
# 4. **`memberId` 能给就给。** 会员账户 / 账单页知道当前会员，页头上的贡献块
#    （绑到会员的购物车）要按它查。认证页是访客，不传。
#
# 5. **helper 不自己解析 home mount。** path handler 的输入里本来就有
#    `homePath` / `homeLayoutKey`；自挂路由的那几张页各自 `resolveVisitorHomePath`
#    （它们手上已经有 entitlements）。helper 里再查一遍等于每张页多一次读。
