# 模块自有 SSR 页的**页头页脚**丢了贡献上下文（修 bug，一次修完五个贡献方）。
#
# 通用管线（`ssr.routes.ts` 的 `renderLogicalPath`）渲染前会
# `collectSectionTypes(header/footer/page.sections)` → `resolveSectionContexts`，
# 把各模块的按请求数据合进 `contributed`。而**自己挂路由 / 自己接 path handler**
# 的那些页（店面、文档库、会员三张、订阅三张）各自直接调 `renderMarketingHtml`，
# 只传了自己那一份——页头页脚上的贡献块于是全部拿不到数据，各自退回兜底。
#
# 现场：`/subscribe` 的页头挂着七个事件主题格（events 拿不到 `nav_topics` 时兜底
# 显示全部七格，失效方向刻意选了宁可多显示），而同一张页的 `/zh-CN/subscribe`
# 落到通用管线、跑过 provider，只挂租户实际启用的三格。同一张页两个样子。
# 已在 newsletter 单独修过一轮（`modules/newsletter/features/ssr-page-section-contexts`），
# 那一版把「收集 + 跑 provider + 合并」写在了贡献方自己的文件里——其余四个贡献方
# 照抄一遍就是五份会各自漂的实现。本次把它上收成 marketing 的一个渲染入口 helper。
#
# **不是**把 contributed 塞进 `SitePathHandlerInput`：provider 要按「这张页面摆了
# 哪些段」决定跑不跑，而页面版式（模板页 / 预设兜底）只有 handler 自己知道，
# marketing 在调 handler 那一刻还没有 sections。

# ---------- 必填 ----------
module: marketing
surfaces: [ssr]
goal: |
  marketing 新增 `resolvePageContributed()`（收集本页段 type → 跑 provider →
  与渲染方自己那份**键内合并**），并让五个自有 SSR 入口都改走它：
  newsletter 三张事务页、shop 店面、site-docs 文档库、site-member 认证 / 账户页、
  site-billing 会员账单页。events 一并接上（它自己那份 `withEventsNavTopics`
  只补了自家主题格，页头上别的模块的块照样是空的）。
gold: packages/builtin/marketing/server/ssr.routes.ts # renderLogicalPath 里 collect + resolve 那一段就是被上收的原型
