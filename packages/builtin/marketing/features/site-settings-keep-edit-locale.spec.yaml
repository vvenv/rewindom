# 增量功能契约 —— 站点设置保存后保持当前编辑语言

# ---------- 必填 ----------
module: marketing
surfaces: [tenant]
goal: 站点设置 Sheet 里切到非主语言填站名/标语后，改首页、发布等其它项（或失焦保存）引起的数据刷新，不得把编辑语言打回中文，也不得冲掉未失焦的译文
gold: packages/builtin/marketing/client/hooks/use-site-settings-form.ts
