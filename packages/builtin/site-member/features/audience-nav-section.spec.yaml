  - packages/builtin/site-member/features/audience-nav-section.spec.yaml
  - packages/client-kit/src/lib/app-nav-types.ts
  - packages/client-kit/src/i18n/common/locales/zh-CN.json
  - packages/client-kit/src/i18n/common/locales/en.json
  - apps/client/src/collect-modules.ts
  - apps/client/src/collect-modules.test.ts
  - apps/client/src/shell/components/Sidebar.tsx
  - apps/client/src/enabled-modules.ts
  - packages/builtin/marketing/client/tenant/nav-sections.ts
  - packages/builtin/marketing/client/locales/zh-CN.json
  - packages/builtin/marketing/client/locales/en.json
  - packages/builtin/site-member/client/tenant/nav-sections.ts
  - packages/builtin/site-billing/client/tenant/nav-sections.ts
  - packages/builtin/site-billing/client/locales/zh-CN.json
