# 租户侧栏：站点与受众拆组、标题去重、分组顺序与宽度。

module: site-member
surfaces: [tenant]
goal: 把会员/套餐/收款/邮件订阅从「站点」拆到「受众」；页面/媒体/文档/表单留在站点；用 order 钉住分组顺序；侧栏宽度与平台对齐
gold: packages/builtin/marketing/client/tenant/nav-sections.ts
