# 生产 Docker Compose — 与宿主机 Nginx + Certbot 配合（见 scripts/docker-deploy-remote.sh）
# 本地验证: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: rewindom-postgres
    environment:
      POSTGRES_USER: rewindom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rewindom
    volumes:
      - rewindom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewindom -d rewindom"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rewindom-redis
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        exec redis-server --requirepass "$${REDIS_PASSWORD}";
      else
        exec redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - rewindom_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: rewindom-app
    environment:
      NODE_ENV: production
      PORT: 3700
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://rewindom:${DB_PASSWORD}@postgres:5432/rewindom
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: rewindom
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET}
      TENANT_SECRET_ENCRYPTION_KEY: ${TENANT_SECRET_ENCRYPTION_KEY}
      SINGLE_TENANT: ${SINGLE_TENANT:-false}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-platform}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      EXPORT_BASE_DIR: /data/exports
      ATTACHMENT_BASE_DIR: /data/attachments
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://${APP_DOMAIN}}
      PLATFORM_URL: ${PLATFORM_URL:-https://admin.${APP_DOMAIN}}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-}
      MICROSOFT_AUTHORITY: ${MICROSOFT_AUTHORITY:-common}
      CREEM_API_KEY: ${CREEM_API_KEY:-}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
      CREEM_STORE_ID: ${CREEM_STORE_ID:-}
      CREEM_SERVER: ${CREEM_SERVER:-}
      CREEM_PRODUCT_MAP: ${CREEM_PRODUCT_MAP:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      - rewindom_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    container_name: rewindom-web
    environment:
      # nginx map：仅平台控制台 Host 走静态 SPA；产品主域与其它 Host 反代 Marketing SSR
      APP_DOMAIN: ${APP_DOMAIN}
      PLATFORM_HOST: ${PLATFORM_HOST:-admin.${APP_DOMAIN}}
    ports:
      - "127.0.0.1:${APP_PORT:-3700}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  rewindom_pg:
  rewindom_redis:
  rewindom_storage:
