# 生产 Docker Compose — 与宿主机 Nginx + Certbot 配合（见 scripts/docker-deploy-remote.sh）
# 本地验证: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: rewindom-postgres
    environment:
      POSTGRES_USER: rewindom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rewindom
    volumes:
      - rewindom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewindom -d rewindom"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rewindom-redis
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        exec redis-server --requirepass "$${REDIS_PASSWORD}";
      else
        exec redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - rewindom_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    container_name: rewindom-app
    environment:
      NODE_ENV: production
      PORT: 3700
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://rewindom:${DB_PASSWORD}@postgres:5432/rewindom
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: rewindom
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET}
      TENANT_SECRET_ENCRYPTION_KEY: ${TENANT_SECRET_ENCRYPTION_KEY}
      # 可信代理：容器网桥 + 宿主 nginx 都是私网，故默认 uniquelocal。
      # 外层若是公网出口的云 LB，改成该 LB 的实际网段，别放宽成 0.0.0.0/0。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-uniquelocal}
      # IP 访问控制。ALWAYS_ALLOW 是压过一切封禁的豁免名单（监控 / 回调 / 办公出口），
      # 留空意味着任何一条过宽的规则都能把你自己锁在后台外面。
      IP_ACCESS_ENABLED: ${IP_ACCESS_ENABLED:-true}
      IP_ACCESS_ALWAYS_ALLOW: ${IP_ACCESS_ALWAYS_ALLOW:-}
      # 站点挂在 Cloudflare 橙云后面时必须为 true，否则所有访客坍缩成 CF 边缘 IP
      CLOUDFLARE_PROXY: ${CLOUDFLARE_PROXY:-false}
      # CF 之外的代理 / CDN 出口段（云 LB、其它 CDN）；这些地址永不自动封禁
      IP_ACCESS_PROXY_RANGES: ${IP_ACCESS_PROXY_RANGES:-}
      IP_ACCESS_TRAFFIC_STATS: ${IP_ACCESS_TRAFFIC_STATS:-true}
      IP_ACCESS_AUTO_BAN_MINUTES: ${IP_ACCESS_AUTO_BAN_MINUTES:-60}
      IP_ACCESS_LOGIN_FAILURE_THRESHOLD: ${IP_ACCESS_LOGIN_FAILURE_THRESHOLD:-10}
      IP_ACCESS_LOGIN_FAILURE_WINDOW_MINUTES: ${IP_ACCESS_LOGIN_FAILURE_WINDOW_MINUTES:-15}
      IP_ACCESS_NGINX_EXPORT_PATH: ${IP_ACCESS_NGINX_EXPORT_PATH:-/data/ip-access/blocklist.conf}
      SINGLE_TENANT: ${SINGLE_TENANT:-false}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-}
      EVENTS_INGEST_ENABLED: ${EVENTS_INGEST_ENABLED:-true}
      EVENTS_INGEST_INTERVAL_MINUTES: ${EVENTS_INGEST_INTERVAL_MINUTES:-15}
      EVENTS_ANALYZER: ${EVENTS_ANALYZER:-auto}
      EVENTS_LLM_MIN_SIGNALS: ${EVENTS_LLM_MIN_SIGNALS:-2}
      EVENTS_LLM_TOP_EVENTS: ${EVENTS_LLM_TOP_EVENTS:-30}
      EVENTS_LLM_COOLDOWN_MINUTES: ${EVENTS_LLM_COOLDOWN_MINUTES:-30}
      EVENTS_LLM_CLASSIFY_PER_ROUND: ${EVENTS_LLM_CLASSIFY_PER_ROUND:-40}
      EVENTS_PENDING_CLUSTER_LIMIT: ${EVENTS_PENDING_CLUSTER_LIMIT:-500}
      EVENTS_SIGNAL_RETENTION_DAYS: ${EVENTS_SIGNAL_RETENTION_DAYS:-90}
      EVENTS_EVENT_RETENTION_DAYS: ${EVENTS_EVENT_RETENTION_DAYS:-180}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-platform}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      EXPORT_BASE_DIR: /data/exports
      ATTACHMENT_BASE_DIR: /data/attachments
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://${APP_DOMAIN}}
      PLATFORM_URL: ${PLATFORM_URL:-https://admin.${APP_DOMAIN}}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-}
      MICROSOFT_AUTHORITY: ${MICROSOFT_AUTHORITY:-common}
      CREEM_API_KEY: ${CREEM_API_KEY:-}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
      CREEM_STORE_ID: ${CREEM_STORE_ID:-}
      CREEM_SERVER: ${CREEM_SERVER:-}
      CREEM_PRODUCT_MAP: ${CREEM_PRODUCT_MAP:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_RESEND_API_KEY: ${MAIL_RESEND_API_KEY:-}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}
      ACME_HELPER_URL: ${ACME_HELPER_URL:-http://host.docker.internal:9370}
      ACME_HELPER_TOKEN: ${ACME_HELPER_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rewindom_storage:/data
      # 与 web 共享的 IP 封禁片段（单独一卷，不把整个 storage 暴露给 nginx）
      - rewindom_ip_access:/data/ip-access
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    container_name: rewindom-web
    environment:
      # nginx map：仅平台控制台 Host 走静态 SPA；产品主域与其它 Host 反代 Marketing SSR
      APP_DOMAIN: ${APP_DOMAIN}
      PLATFORM_HOST: ${PLATFORM_HOST:-admin.${APP_DOMAIN}}
    volumes:
      # app 写、nginx 读。stub 脚本会在文件缺失时补一个「谁都不封」的占位，
      # 否则首次部署时 include 找不到文件，nginx 起不来。
      - rewindom_ip_access:/etc/nginx/ip-access
    ports:
      - "127.0.0.1:${APP_PORT:-3700}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  rewindom_pg:
  rewindom_redis:
  rewindom_storage:
  rewindom_ip_access:
