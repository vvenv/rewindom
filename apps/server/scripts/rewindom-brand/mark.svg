<!--
  Rewindom 品牌标：厚壁圆环顶开一条径向缝（玉玦）。

  形就是产品口径——底座是闭合的环（内核不含业务），顶上那条缝是模块挂上去的口
  （底座随业务成形）。单一连通实心，缩到 16px 仍然是它自己。

  几何与工作台 Logo / `apps/client/public/favicon.svg` / `docs/assets/logo.svg`
  同一条 path。标就是这块玉玦，不套圆角色块：环本身已有轮廓，再加方块会把
  24px 页头收成「又一个 App 图标」，并和工作台那套身份打架。

  浅底 #0369a1、深底 #38bdf8（与 favicon.svg 同一组 token）。`prefers-color-scheme`
  只跟 OS，官网自己的明暗（data-site-color-mode）管不到 <img> 里的 SVG。

  平台会裁切的图（头像 / apple-touch / maskable）由 generate.mjs 另铺 accent 底、
  改白填——那层底是平台的画布，不是品牌容器。

  几何改动要同步 mark-mono.svg，并重跑 generate.mjs 出位图。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Rewindom">
  <style>
    .mark { fill: #0369a1; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #38bdf8; }
    }
  </style>
  <path class="mark" fill="#0369a1" d="M87.54 27.86A108 108 0 1 0 168.46 27.86L142.24 92.77A38 38 0 1 1 113.76 92.77Z"/>
</svg>
