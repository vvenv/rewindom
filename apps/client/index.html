<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0369a1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="be-water" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>be-water</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem("theme");
          var isDark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.add(isDark ? "dark" : "light");
          root.style.colorScheme = isDark ? "dark" : "light";

          // 与 theme 同构：首屏前恢复语言，避免 HTML lang / 无障碍读屏闪一下
          var locale =
            localStorage.getItem("app-locale") ||
            localStorage.getItem("app-locale-default") ||
            "zh-CN";
          if (locale === "en" || locale === "zh-CN") {
            root.lang = locale;
          }
        } catch (e) {
          /* localStorage 不可用时退回默认亮色 / zh-CN */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
